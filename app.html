<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="StudyBuddy Pro — KI-gestützte Lernplattform für Schüler. Karteikarten, Prüfungsmodus, KI-Tutor und Lernplan mit Spaced Repetition.">
<meta name="theme-color" content="#6366f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyBuddy">

<link rel="apple-touch-icon" href="/icons/icon-192.svg">
<title>StudyBuddy Pro</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<!-- Theme früh setzen (verhindert Flash); 'light' | 'dark' | 'system' -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sb_theme')||'system';}catch(e){}</script>
<!-- DOMPurify XSS-Schutz (lokal gebündelt für CDN-Ausfallsicherheit) -->
<script src="js/vendor/purify.min.js"></script>
<!-- Supabase JS Client (lokal gebündelt) -->
<script src="js/vendor/supabase.js"></script>
<!-- Chart.js für Eltern-Dashboard (lokal gebündelt) -->
<script src="js/vendor/chart.umd.min.js"></script>
<!-- SheetJS für XLSX-Export (Feature #14) — lokal gebündelt (CSP-konform, kein CDN) -->
<script src="js/vendor/xlsx.full.min.js"></script>
<style>
/* ── Feature #16: Tooltips ─────────────────────────────────────────── */
.sb-tooltip-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: default;
}
.sb-tooltip-icon {
  font-style: normal;
  font-size: 11px;
  color: var(--t3, #94a3b8);
  background: var(--border, #e2e8f0);
  border-radius: 50%;
  width: 16px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: help;
  flex-shrink: 0;
  font-weight: 700;
}
.sb-tooltip-box {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card, #1e293b);
  border: 1px solid var(--border, #334155);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--t2, #cbd5e1);
  white-space: normal;
  min-width: 180px;
  max-width: 260px;
  text-align: center;
  z-index: 9999;
  box-shadow: 0 8px 24px rgba(0,0,0,.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s ease;
  line-height: 1.5;
}
.sb-tooltip-wrap:hover .sb-tooltip-box,
.sb-tooltip-wrap:focus-within .sb-tooltip-box {
  opacity: 1;
}
</style>
</head>
<body>
<div id="app" style="display:none;">
  <!-- Sidebar Overlay (Mobile) -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar" role="navigation" aria-label="Hauptnavigation">
    <div class="sidebar-logo">
      <h2>StudyBuddy <span style="color:var(--acc-yellow)">Pro</span></h2>
      <span id="sb-version">v2.0</span>
    </div>
    <div class="sidebar-user">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="sidebar-avatar" id="sb-avatar">?</div>
        <div>
          <div class="sidebar-name" id="sb-name">Lädt...</div>
          <div class="sidebar-role" id="sb-role"></div>
        </div>
      </div>
    </div>
    <div class="xp-bar-wrap" id="xp-wrap">
      <div class="xp-label">
        <span>⭐ XP</span>
        <span id="xp-val">0</span>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav" role="menubar">
      <!-- Dynamisch gefüllt je nach Rolle -->
    </nav>
  </aside>

  <!-- Main -->
  <main id="main" role="main">
    <header id="header" role="banner">
      <div style="display:flex;align-items:center;gap:12px;">
        <button id="menu-toggle" onclick="toggleSidebar()" aria-label="Menü öffnen" aria-expanded="false">☰</button>
        <h2 class="header-title" id="header-title">Dashboard</h2>
      </div>
      <div class="header-right">
        <div class="streak-chip" id="streak-chip" aria-label="Lernstreak">🔥 <span id="streak-val">0</span> Tage</div>
        <button id="log-btn" onclick="openLog()" title="Aktivitäts-Log öffnen" aria-label="Log öffnen" style="
          background:none;border:1px solid var(--border);border-radius:var(--r-md);
          padding:6px 10px;cursor:pointer;font-size:14px;color:var(--t2);
          display:flex;align-items:center;gap:5px;position:relative;
          transition:background .15s;
        " onmouseover="this.style.background='var(--bg-2)'" onmouseout="this.style.background='none'">
          📋 <span id="log-badge" style="
            display:none;position:absolute;top:-5px;right:-5px;
            background:var(--danger,#ef4444);color:white;
            border-radius:99px;font-size:10px;font-weight:700;
            padding:1px 5px;min-width:16px;text-align:center;
          ">0</span>
        </button>
        <button id="logout-top" onclick="doLogout()" title="Abmelden" aria-label="Abmelden" style="
          background:none;border:1px solid var(--border);border-radius:var(--r-md);
          padding:6px 10px;cursor:pointer;font-size:14px;color:var(--t2);
          display:flex;align-items:center;gap:5px;transition:background .15s;
        " onmouseover="this.style.background='var(--bg-2)'" onmouseout="this.style.background='none'">
          🚪 <span class="logout-label">Abmelden</span>
        </button>
      </div>
    </header>
    <div id="content" role="region" aria-label="Seiteninhalt" aria-live="polite">
      <div style="display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:16px;">
        <div class="spinner" style="width:32px;height:32px;"></div>
        <p style="color:var(--t3);">Lädt…</p>
      </div>
    </div>
  </main>
</div>

<!-- Toast -->
<div id="toast" role="alert" aria-live="assertive"></div>

<!-- Log-Drawer -->
<div id="log-drawer" role="dialog" aria-modal="true" aria-label="Aktivitäts-Log" style="
  position:fixed;inset:0;z-index:9000;display:none;
">
  <!-- Backdrop -->
  <div onclick="closeLog()" style="position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);"></div>
  <!-- Panel -->
  <div id="log-panel" style="
    position:absolute;top:0;right:0;bottom:0;width:min(480px,100vw);
    background:var(--bg-card);border-left:1px solid var(--border);
    display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.18);
    transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  ">
    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0;">
      <div>
        <div style="font-weight:700;font-size:16px;">📋 Aktivitäts-Log</div>
        <div id="log-count" style="font-size:12px;color:var(--t3);margin-top:2px;"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-secondary btn-sm" onclick="clearLog()" title="Log löschen">🗑 Löschen</button>
        <button onclick="closeLog()" aria-label="Log schließen" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--t2);line-height:1;padding:4px;">✕</button>
      </div>
    </div>
    <!-- Filter-Chips -->
    <div style="display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0;">
      <button class="btn btn-sm btn-primary" id="lf-all"     onclick="filterLog('all')"    >Alle</button>
      <button class="btn btn-sm btn-secondary" id="lf-error"   onclick="filterLog('error')"  >❌ Fehler</button>
      <button class="btn btn-sm btn-secondary" id="lf-success" onclick="filterLog('success')" >✅ Erfolg</button>
      <button class="btn btn-sm btn-secondary" id="lf-warning" onclick="filterLog('warning')" >⚠️ Warnung</button>
      <button class="btn btn-sm btn-secondary" id="lf-info"    onclick="filterLog('info')"   >ℹ️ Info</button>
    </div>
    <!-- Entries -->
    <div id="log-entries" style="flex:1;overflow-y:auto;padding:8px 0;"></div>
  </div>
</div>

/**
 * Übersetzungs-Helper. Gibt den String für den aktuellen Nutzer zurück.
 * Platzhalter {0}, {1}, … werden durch die übergebenen Argumente ersetzt.
 * Fallback: Deutsch, dann der Key selbst.
 * @param {string} key
 * @param {...string} args
 */
function t(key, ...args) {
  const lang = getCurrentLang();
  const str = (I18N[lang] || I18N.de)[key] ?? I18N.de[key] ?? key;
  return args.reduce((s, a, i) => s.replace(`{${i}}`, a ?? ''), str);
}

/**
 * Exportiert ein 2D-Array als .xlsx (SheetJS) oder .csv (Fallback).
 * BOM (\uFEFF) stellt sicher, dass Excel Umlaute korrekt erkennt.
 *
 * @param {string}     filename — Dateiname ohne Endung
 * @param {string[][]} rows     — Zeilen; erste Zeile = Header
 * @param {string}     [sheetName='Export'] — Name des Arbeitsblatts
 */
function exportXLSX(filename, rows, sheetName = 'Export') {
  if (!rows || rows.length <= 1) { toast(t('export.empty')); return; }

  if (typeof XLSX !== 'undefined') {
    // SheetJS-Pfad — echtes .xlsx
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, filename + '.xlsx');
  } else {
    // CSV-Fallback wenn SheetJS nicht geladen
    const csv = rows
      .map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(','))
      .join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename + '.csv'; a.click();
    URL.revokeObjectURL(url);
  }
}

/**
 * Exportiert alle Karteikarten des aktuell gewählten Fachs als XLSX/CSV.
 * Spalten: Fach, Frage, Antwort, Level, Nächste Wiederholung
 * @param {string} [subject] — Fach; nutzt FC.subj wenn nicht angegeben
 */
/** Exportiert die Karten des aktuellen Fachs als CSV (Frage,Antwort). */
function exportCardsCSV(subject) {
  const subj = subject || FC.subj || Object.keys(D.cards)[0];
  const cards = (D.cards[subj] || []);
  if (!cards.length) { toast(t('export.empty')); return; }
  const esc = s => /[",\n]/.test(s) ? '"' + String(s).replace(/"/g, '""') + '"' : String(s);
  const csv = 'Frage,Antwort\n' + cards.map(c => esc(c.front) + ',' + esc(c.back)).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = subj + '_karteikarten.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/** Importiert Karten aus einer CSV-Datei (Spalten: Frage,Antwort; Header optional). */
async function importCardsCSV(input) {
  const file = input?.files?.[0];
  if (!file) return;
  try {
    const rows = _parseCSV(await file.text());
    if (!D.cards[FC.subj]) D.cards[FC.subj] = [];
    let n = 0;
    rows.forEach((r, i) => {
      const front = (r[0] || '').trim(), back = (r[1] || '').trim();
      if (!front || !back) return;
      if (i === 0 && /^(frage|question|front|vorderseite)$/i.test(front)) return; // Header
      D.cards[FC.subj].push({ id: 'c' + Date.now() + Math.random(), front, back, level: 0, due: 0 });
      n++;
    });
    if (!n) throw new Error('Keine gültigen Zeilen (Format: Frage,Antwort)');
    save(); toast(`🎉 ${n} Karten importiert!`);
    renderFC(document.getElementById('content'));
  } catch (e) { toast('❌ ' + e.message); }
  finally { if (input) input.value = ''; }
}

/** Minimaler CSV-Parser (Komma-getrennt, "..."-Quoting, \n/\r\n). */
function _parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

function exportFlashcards(subject) {
  const subj = subject || FC.subj || Object.keys(D.cards)[0];
  if (!subj) { toast(t('export.empty')); return; }

  const cards = D.cards[subj] || [];
  if (!cards.length) { toast(t('export.empty')); return; }

  const lang = getCurrentLang();
  const headers = {
    de: ['Fach', 'Frage', 'Antwort', 'Level', 'Nächste Wiederholung'],
    en: ['Subject', 'Question', 'Answer', 'Level', 'Next Review'],
    fr: ['Matière', 'Question', 'Réponse', 'Niveau', 'Prochaine révision'],
    es: ['Materia', 'Pregunta', 'Respuesta', 'Nivel', 'Próxima revisión'],
  };
  const rows = [
    headers[lang] || headers.de,
    ...cards.map(c => [
      subj,
      c.front || '',
      c.back || '',
      c.level ?? 0,
      c.due ? new Date(c.due).toLocaleDateString(lang === 'de' ? 'de-DE' : lang + '-' + lang.toUpperCase()) : '—',
    ]),
  ];

  const dateStr = new Date().toISOString().slice(0, 10);
  exportXLSX(`StudyBuddy_Karteikarten_${subj}_${dateStr}`, rows, subj);
  toast(t('export.success_cards'));
}

/**

 */
function exportExams() {
  const exams = D.exams || [];

}

/** Aktuelle Unterrichtssprache des Nutzers (Standard: 'de') */
function getCurrentLang() { return U?.language || 'de'; }

/**
 * Gibt die Fächerliste für ein Kind zurück.
 * Priorität: 1. Individuelle Fächer (DB), 2. Standard nach Sprache+Klasse
 * @param {object} [child] — Child-Objekt (default: aktueller Nutzer U)
 */
function getChildSubjects(child) {
  const c = child || U;
  if (Array.isArray(c?.subjects) && c.subjects.length) return c.subjects;
  const lang  = c?.language || 'de';
  const grade = Number(c?.grade) || 9;
  const byLang = CFG.SUBJECTS_BY_LANG[lang] || CFG.SUBJECTS_BY_LANG['de'];
  const grades = Object.keys(byLang).map(Number).sort((a,b)=>a-b);
  const g = grades.reduce((prev,curr) => Math.abs(curr-grade)<Math.abs(prev-grade)?curr:prev);
  return byLang[g] || CFG.SUBJECTS[9];
}

/**
 * Baut den KI-Tutor System-Prompt in der richtigen Sprache.
 * Sprachfächer (Englisch, Français…) werden in der Sprache des Fachs beantwortet.
 */
function buildTutorPrompt(subject, grade, lang) {
  lang = lang || 'de';
  const subjectLang  = CFG.LANG_SUBJECTS[subject];
  const isLangSubj   = subjectLang && subjectLang !== lang;
  const answerLang   = isLangSubj ? (CFG.LANG_NAMES[subjectLang] || subjectLang) : null;
  const langNote     = isLangSubj ? ` Antworten und Erklärungen auf ${answerLang}.` : '';
  const langNoteEn   = isLangSubj ? ` Answers and explanations in ${answerLang}.` : '';
  const langNoteFr   = isLangSubj ? ` Réponses et explications en ${answerLang}.` : '';
  const langNoteEs   = isLangSubj ? ` Respuestas y explicaciones en ${answerLang}.` : '';
  const p = {
    de: `Du bist StudyBuddy, ein freundlicher KI-Lernassistent für Klasse ${grade} im Fach ${subject}. Erkläre verständlich auf Deutsch, max. 3–4 Sätze.${langNote}`,
    en: `You are StudyBuddy, a friendly AI tutor for Year ${grade} studying ${subject}. Explain clearly in English, max 3–4 sentences.${langNoteEn}`,
    fr: `Tu es StudyBuddy, un assistant IA pour la classe ${grade} en ${subject}. Explique clairement en français, max 3–4 phrases.${langNoteFr}`,
    es: `Eres StudyBuddy, un asistente IA para el curso ${grade} en ${subject}. Explica claramente en español, máx. 3-4 frases.${langNoteEs}`,
  };
  return p[lang] || p['de'];
}

// Token pro Profil in localStorage. Holt Schul-Aufgaben (delegiert, schüler-zustimmbar).
const MS = {

};
function _b64url(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function _msRand(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return _b64url(a.buffer); }

/** Ist das aktuelle Profil mit einem Schul-Konto verbunden? */
function msConnected() { return !!(U?.id && localStorage.getItem('ms_conn_' + U.id)); }

/** Startet die Schul-Konto-Anbindung (OAuth + PKCE) für das aktuelle Profil. */
async function msConnect() {
  if (!U?.id) return;
  const verifier = _msRand(48);
  const challenge = _b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const state = _msRand(16);
  sessionStorage.setItem('ms_pkce', JSON.stringify({ verifier, state, who: U.id }));
  const p = new URLSearchParams({
    client_id: MS.clientId, response_type: 'code', redirect_uri: MS.redirectUri,
    scope: MS.scopes, code_challenge: challenge, code_challenge_method: 'S256',
    state, response_mode: 'query', prompt: 'select_account',
  });
  location.href = MS.authority + '/oauth2/v2.0/authorize?' + p.toString();
}

/** Verarbeitet die OAuth-Rückleitung (?code=…) nach dem Login. */
async function msHandleRedirect() {
  const q = new URLSearchParams(location.search);
  const code = q.get('code'), err = q.get('error');
  if (!code && !err) return;
  history.replaceState({}, '', '/app.html'); // ?code aus der URL entfernen
  if (err) return toast('❌ Schul-Login: ' + (q.get('error_description') || err), 7000);
  let pk = null; try { pk = JSON.parse(sessionStorage.getItem('ms_pkce') || 'null'); } catch (e) {}
  sessionStorage.removeItem('ms_pkce');
  if (!pk || pk.state !== q.get('state')) return toast('❌ Schul-Login: ungültiger State', 7000);
  try {
    const body = new URLSearchParams({
      client_id: MS.clientId, grant_type: 'authorization_code', code,
      redirect_uri: MS.redirectUri, code_verifier: pk.verifier, scope: MS.scopes,
    });
    const r = await fetch(MS.authority + '/oauth2/v2.0/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error_description || d.error || 'Token-Fehler');
    localStorage.setItem('ms_conn_' + (pk.who || U.id), JSON.stringify({ access: d.access_token, refresh: d.refresh_token || null, exp: Date.now() + (d.expires_in || 3600) * 1000 }));
    toast('✅ Schul-Konto verbunden!');
    await msSyncAssignments();
  } catch (e) { toast('❌ Schul-Login: ' + e.message, 7000); }
}

/** Gibt ein gültiges Access-Token zurück (refresht bei Bedarf), sonst null. */
async function msToken() {
  if (!U?.id) return null;
  const raw = localStorage.getItem('ms_conn_' + U.id); if (!raw) return null;
  let c; try { c = JSON.parse(raw); } catch (e) { return null; }
  if (c.exp - 60000 > Date.now()) return c.access;
  if (!c.refresh) { localStorage.removeItem('ms_conn_' + U.id); return null; }
  try {
    const body = new URLSearchParams({ client_id: MS.clientId, grant_type: 'refresh_token', refresh_token: c.refresh, scope: MS.scopes });
    const r = await fetch(MS.authority + '/oauth2/v2.0/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
    const d = await r.json(); if (!r.ok) throw new Error('refresh');
    const conn = { access: d.access_token, refresh: d.refresh_token || c.refresh, exp: Date.now() + (d.expires_in || 3600) * 1000 };
    localStorage.setItem('ms_conn_' + U.id, JSON.stringify(conn));
    return conn.access;
  } catch (e) { localStorage.removeItem('ms_conn_' + U.id); return null; }
}

/** Extrahiert Aufgaben aus einem Foto/PDF (Teams-Screenshot, Tafel, Schulportal) via KI. */
async function genTasksFromImage(input) {
  const file = input?.files?.[0]; if (!file) return;
  const isPdf = file.type === 'application/pdf';
  if (!/^image\//.test(file.type) && !isPdf) { input.value = ''; return toast('❌ Nur Bilder (JPG/PNG) oder PDF'); }
  if (isPdf && AI.provider !== 'claude') { input.value = ''; return toast('❌ PDF nur mit Claude'); }
  if (file.size > 6 * 1024 * 1024) { input.value = ''; return toast('❌ Datei zu groß (max. 6 MB)'); }
  try {
    const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
    await _aiTasks(null, { mime: isPdf ? 'application/pdf' : file.type, data: String(dataUrl).split(',')[1] || '' });
  } catch (e) { toast('❌ ' + e.message, 7000); }
  finally { if (input) input.value = ''; }
}

/**
 * Speichert eine abgeschlossene Lernsession in Supabase (Tabelle `sessions`).
 * Wird beim Beenden des Pomodoro-Timers und nach Karteikarten-Sessions gerufen.
 * @async
 * @param {string} subject     — Fachname
 * @param {string} type        — Session-Typ ('flashcard' | 'exam' | 'tutor' | 'pomodoro')
 * @param {number} durationMin — Dauer in Minuten
 * @param {number} xpEarned    — Verdiente XP
 * @returns {Promise<void>}
 */
/**
 * Erfasst eine abgeschlossene Lerneinheit lokal in D.sessions (Basis für weeklyXP /
 * Eltern-Chart) und synchronisiert sie für Auth-Nutzer in die Supabase-sessions-Tabelle.
 * @param {string|null} subject — Fach (oder null, z.B. Pomodoro)
 * @param {string} type — 'flashcard' | 'exam' | 'tutor' | 'pomodoro'
 * @param {number|null} durationMin — Dauer in Minuten (oder null)
 * @param {number} xp — verdiente XP
 */
function recordSession(subject, type, durationMin, xp) {
  D.sessions = D.sessions || [];
  D.sessions.push({
    subject: subject || null,
    session_type: type,
    duration_minutes: durationMin || null,
    xp_earned: xp || 0,
    created_at: new Date().toISOString(),
  });
  if (D.sessions.length > 300) D.sessions = D.sessions.slice(-300); // Blob/Sync-Payload begrenzen
  touchStreak(); // Streak/lastStudy bei jeder Lernaktion aktualisieren (inkl. Freeze)
  syncSession(subject, type, durationMin, xp); // Auth-Nutzer: zusätzlich in sessions-Tabelle
}

/**
 * Aktualisiert Lern-Streak + lastStudy bei einer Lernaktion (P1.1 Retention).
 * - gleicher Tag: keine Änderung · gestern: +1 · Lücke: Freeze einsetzen, sonst Reset auf 1.
 * - Schreibt wöchentlich (max. 3) einen Streak-Freeze gut.
 * Hinweis: streak/lastStudy syncen geräteübergreifend; freezes/dailyGoal sind v1 nur lokal.
 */
function touchStreak() {
  const now = Date.now(), dayMs = 86400000;
  const day0 = (ts) => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
  // Wöchentlich 1 Freeze gutschreiben (max. 3)
  if (!D.lastFreezeGrant) D.lastFreezeGrant = now;
  else if (now - D.lastFreezeGrant >= 7*dayMs) {
    const weeks = Math.floor((now - D.lastFreezeGrant) / (7*dayMs));
    D.freezes = Math.min(3, (D.freezes||0) + weeks);
    D.lastFreezeGrant += weeks * 7*dayMs;
  }
  const today0 = day0(now), lastDay0 = D.lastStudy ? day0(D.lastStudy) : 0;
  if (lastDay0 !== today0) {
    const gap = lastDay0 ? Math.round((today0 - lastDay0) / dayMs) : 1;
    if (gap <= 1) { D.streak = (D.streak||0) + 1; }            // gestern (oder erste Aktion) → +1
    else {                                                      // Lücke
      const missed = gap - 1;
      if ((D.freezes||0) >= missed) { D.freezes -= missed; D.streak = (D.streak||0) + 1; } // Freeze rettet Streak
      else { D.streak = 1; }                                    // sonst Reset
    }
  }
  D.lastStudy = now;
}

/** Setzt das Tagesziel (Karten/Tag) und rendert das Dashboard neu. */

  D.dailyGoal = Math.max(1, Math.min(50, parseInt(v) || 5));

// ── Cloud-Persistenz: Karten/Aufgaben/Prüfungen ⇄ Supabase ──────────────────
// Eltern/Schüler: über RLS (auth.uid()). Kinder: über PIN-verifizierte RPCs.
// Persistenz folgt der save()-Semantik (Ganz-Ersetzen) und läuft transaktional in den RPCs.

const _UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
/** Gibt id zurück, wenn sie eine UUID ist — sonst undefined (DB generiert dann eine). */
function _uid(id) { return _UUID_RE.test(id || '') ? id : undefined; }

/** D.cards (Objekt subject→Array) → flaches Zeilen-Array für die DB. */
function _cardsToRows() {
  const rows = [];
  for (const subj in (D.cards || {})) {
    for (const c of (D.cards[subj] || [])) {
      rows.push({
        id: _uid(c.id), subject: subj, front: c.front, back: c.back,
        level: c.level || 0,
        due_at: new Date(c.due || Date.now()).toISOString(),
        ease: c.ease || 2.5, reps: c.reps || 0, interval_days: c.interval || 0,
        topic: c.topic || null,
        exam_name: c.examName || null, exam_date: c.examDate || null,
        explain: c.explain || null,
      });
    }
  }
  return rows;
}
function _tasksToRows() {
  return (D.tasks || []).map(t => ({
    id: _uid(t.id), title: t.title, subject: t.subject || null,
    due_at: t.due || null, completed: !!t.completed,
  }));
}
function _examsToRows() {
  return (D.exams || []).map(e => ({
    id: _uid(e.id), subject: e.subject, score: e.score, total: e.total,
    created_at: e.date ? new Date(e.date).toISOString() : new Date().toISOString(),
  }));
}
/** Wöchentliche XP aus D.sessions (für Kind-Stats / Eltern-Chart). */
function _weekly() {
  const days = Array(7).fill(0);
  (D.sessions || []).forEach(s => {
    const d = Math.floor((Date.now() - new Date(s.created_at).getTime()) / 86400000);
    if (d >= 0 && d < 7) days[6 - d] += (s.xp_earned || 0);
  });
  return days;
}
/** DB-Daten { cards:[], tasks:[], exams:[] } in den State D übernehmen. */
function _applyCloudData(d) {
  const cards = {};
  (d.cards || []).forEach(c => {
    (cards[c.subject] = cards[c.subject] || []).push({
      id: c.id, front: c.front, back: c.back,
      level: c.level || 0,
      due: c.due_at ? new Date(c.due_at).getTime() : Date.now(),
      ease: c.ease != null ? Number(c.ease) : 2.5,
      reps: c.reps || 0,
      interval: c.interval_days || 0,
      topic: c.topic || null,
      examName: c.exam_name || null, examDate: c.exam_date || null,
      explain: c.explain || null,
    });
  });
  D.cards = cards;
  D.tasks = (d.tasks || []).map(t => ({
    id: t.id, title: t.title, subject: t.subject || '',
    due: t.due_at || '', completed: !!t.completed,
  }));
  D.exams = (d.exams || []).map(e => ({
    id: e.id, subject: e.subject, score: e.score, total: e.total, date: e.created_at,
  }));
}

/**
 * Lädt Karten/Aufgaben/Prüfungen (+ Stats) aus Supabase in D.
 * Cloud hat Vorrang; ist die Cloud leer, aber lokal Daten vorhanden, wird einmalig
 * lokal → Cloud migriert (Rückgabe true). Offline-Fehler lassen lokale Daten unangetastet.
 * @returns {Promise<boolean>} true, wenn lokale Daten in die (leere) Cloud hochzuladen sind
 */
async function loadCloudData() {
  if (!sb || !U) return false;
  try {
    let cloud = null;
    if (U.isChild) {
      if (!U.id || !_childPin) return false;
      const { data } = await sb.rpc('load_child_data', { p_child_id: U.id, p_pin: _childPin });
      if (data && !data.error) {
        cloud = data;
        const st = data.stats;
        if (st) {
          D.xp = st.xp || 0; D.streak = st.streak || 0;
          D.correct = st.correct || 0; D.total = st.total || 0;
          if (st.lastStudy) D.lastStudy = new Date(st.lastStudy).getTime();
          if (st.dailyGoal) D.dailyGoal = st.dailyGoal;
          D.freezes = st.freezes || 0;
          if (st.lastFreezeGrant) D.lastFreezeGrant = st.lastFreezeGrant;
        }
      }
    } else {
      const { data: stats } = await sb.from('user_stats').select('*').eq('user_id', U.id).single();
      if (stats) {
        D.xp = stats.xp || 0; D.streak = stats.streak || 0;
        D.correct = stats.total_correct || 0; D.total = stats.total_answered || 0;
        if (stats.last_study_at) D.lastStudy = new Date(stats.last_study_at).getTime();
        if (stats.daily_goal) D.dailyGoal = stats.daily_goal;
        D.freezes = stats.freezes || 0;
        if (stats.last_freeze_grant) D.lastFreezeGrant = Number(stats.last_freeze_grant);
      }
      const { data } = await sb.rpc('load_my_data');
      if (data) cloud = data;
    }
    if (cloud) {
      const hasCloud = (cloud.cards && cloud.cards.length) ||
                       (cloud.tasks && cloud.tasks.length) ||
                       (cloud.exams && cloud.exams.length);
      const hasLocal = Object.keys(D.cards || {}).length ||
                       (D.tasks || []).length || (D.exams || []).length;
      if (hasCloud) { _applyCloudData(cloud); }
      else if (hasLocal) { return true; } // Cloud leer → lokale Daten migrieren
    }
  } catch(e) { /* offline: lokale Daten bleiben Quelle der Wahrheit */ }
  return false;
}

/** Stößt einen debounced Cloud-Sync an (coalesct schnelle save()-Folgen). */
function syncData() {
  if (!sb || !U || !_dataLoaded) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(_syncDataNow, 1200);
}
async function _syncDataNow() {
  if (!sb || !U || !_dataLoaded) return;
  try {
    if (U.isChild) {
      if (!U.id || !_childPin) return;
      await sb.rpc('sync_child_data', {
        p_child_id: U.id, p_pin: _childPin,
        p_cards: _cardsToRows(), p_tasks: _tasksToRows(), p_exams: _examsToRows(),
        p_xp: D.xp || 0, p_streak: D.streak || 0,
        p_correct: D.correct || 0, p_total: D.total || 0,
        p_weekly: _weekly(),
        p_daily_goal: D.dailyGoal || 5, p_freezes: D.freezes || 0, p_lfg: D.lastFreezeGrant || null,
      });
    } else {
      await sb.rpc('sync_my_data', {
        p_cards: _cardsToRows(), p_tasks: _tasksToRows(), p_exams: _examsToRows(),
      });
    }
  } catch(e) { /* offline ok — lokale Daten bleiben erhalten */ }
}

// ═══════════════════════════════════════════════════════════════════════════
// INPUT SANITIZATION (XSS-Schutz)
// ═══════════════════════════════════════════════════════════════════════════
/**
 * Bereinigt einen String vollständig für sichere Ausgabe in innerHTML.
 * Verwendet DOMPurify wenn verfügbar, sonst manuelles HTML-Escaping.
 * Alle Nutzer-Eingaben MÜSSEN durch safe() oder safeHTML() geleitet werden.
 * @param {*} str — Zu bereinigender Wert (nicht-Strings werden '' zurückgegeben)
 * @returns {string} Sicherer HTML-Text ohne Tags oder Attribute
 */
function safe(str) {
  if (typeof str !== 'string') return '';
  if (window.DOMPurify) return DOMPurify.sanitize(str, { ALLOWED_TAGS:[], ALLOWED_ATTR:[] });
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/**
 * Bereinigt HTML-String für sichere Ausgabe in innerHTML — erlaubt eine
 * Whitelist an Formatierungs-Tags (b, i, code, ul, li usw.).
 * Für KI-Antworten und Rich-Text-Inhalte verwenden.
 * @param {string} html — HTML-String mit erlaubten Formatierungen
 * @returns {string} Bereinigtes HTML
 */
function safeHTML(html) {
  if (window.DOMPurify) return DOMPurify.sanitize(html, {
    ALLOWED_TAGS:['b','i','em','strong','br','p','ul','ol','li','code','pre','span'],
    ALLOWED_ATTR:['class','style']
  });
  return safe(html);
}

// ═══════════════════════════════════════════════════════════════════════════
// MULTI-PROVIDER KI — via Supabase Edge Function (sicherer Proxy)
// ═══════════════════════════════════════════════════════════════════════════
/**
 * Sendet eine Anfrage an den KI-Provider über den serverseitigen Proxy.
 * Authentifizierungsablauf:
 *   1. Auth-Nutzer → JWT-Bearer-Token; Edge Function liest Key aus DB (sicher)
 *   2. Kind/Demo   → Key aus RAM (vom Elternteil geerbt) wird im Body mitgegeben
 *
 * Beinhaltet:
 *   - In-Memory-Cache (Cache-Dauer: CFG.CACHE_TTL)
 *   - Rate-Limiting (CFG.RATE_LIMIT Anfragen/Minute)
 *   - Fehlerweiterleitung an aufrufende Funktion (throw)
 *
 * @async
 * @param {Array<{role:'user'|'assistant', content:string}>} messages — Gesprächsverlauf
 * @param {string}  system   — System-Prompt (Rolle und Kontext des Assistenten)
 * @param {number}  [maxTok=400] — Max. Tokens der Antwort
 * @param {boolean} [useCache=true] — Cache nutzen (false für Echtzeit-Chat)
 * @returns {Promise<string>} KI-Antwort als Plaintext
 * @throws {Error} Bei Rate-Limit, fehlendem Key oder Proxy-Fehler
 */
async function ai(messages, system, maxTok=400, useCache=true, image=null) {
  const prov = AI.provider;
  if (image) useCache = false; // Bild/PDF-Anfragen nicht cachen (Cache-Key basiert nur auf Text)

  // Cache
  const ckBase = prov + system + JSON.stringify(messages);
  if (useCache) {
    const ck = 'ai_' + btoa(encodeURIComponent(ckBase)).slice(0,40);
    const cached = _aiCache.get(ck);
    if (cached && Date.now() < cached.exp) return cached.val;
  }

  // Rate-Limit
  if (_aiReqs >= CFG.RATE_LIMIT) throw new Error('Zu viele KI-Anfragen — bitte kurz warten');
  _aiReqs++;
  if (!_aiReset) _aiReset = setTimeout(() => { _aiReqs=0; _aiReset=null; }, 60000);

  // Headers aufbauen
  const headers = { 'Content-Type': 'application/json' };
  const payload = { provider: prov, messages, system, maxTok };
  if (image) payload.image = image; // { mime, data } für Vision/PDF

  // Supabase-Gateway benötigt immer Bearer-Token — SB_KEY (anon JWT)
  headers['Authorization'] = 'Bearer ' + SB_KEY;

  const ramKey = activeKey();

  if (ramKey) {
    // Pfad 1: Key im RAM (gerade eingegeben oder noch nicht aus DB gelöscht)
    payload.apiKey = ramKey;
  } else if (U?.isChild && U?.id) {
    // Pfad 2: Kind → Proxy holt Parent-Key aus DB anhand childId
    payload.childId = U.id;
  } else if (sb && U?.id && !U?.isChild) {
    // Pfad 3: Authentifizierter Elternteil → Key aus DB laden und im Body senden
    // (User-JWT vom Gateway für Edge Functions abgelehnt → Key client-seitig aus DB holen)
    const { data: keyRow } = await sb.from('api_keys')
      .select('api_key')
      .eq('user_id', U.id)
      .eq('provider', prov)
      .maybeSingle();
    if (keyRow?.api_key) {
      payload.apiKey = keyRow.api_key;
    } else {
      throw new Error(`${PROVIDERS[prov]?.name||prov} API Key fehlt — bitte in Einstellungen eintragen`);
    }
  } else {
    throw new Error(`${PROVIDERS[prov]?.name||prov} API Key fehlt — Elternteil trägt ihn in Einstellungen ein`);
  }

  const r = await fetch(CFG.AI_PROXY, {
    method: 'POST',
    headers,
    body: JSON.stringify(payload),
  });

  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data?.error || `KI-Fehler ${r.status}`);
  const text = data.text || '';

  if (useCache && text) {
    const ck = 'ai_' + btoa(encodeURIComponent(ckBase)).slice(0,40);
    _aiCache.set(ck, { val: text, exp: Date.now() + CFG.CACHE_TTL });
  }
  return text;
}

// AUTH & INIT
// ═══════════════════════════════════════════════════════════════════════════
/**
 * Haupt-Initialisierungsfunktion — wird beim DOMContentLoaded aufgerufen.
 * Auth-Kaskade (erste Übereinstimmung gewinnt):
 *   1. Supabase-Session (echter Login via E-Mail/OAuth)
 *   2. sessionStorage 'sb_session' (Redirect von index.html nach Login)
 *   3. sessionStorage 'sb_demo_login' (Demo-Modus)
 *   4. sessionStorage 'sb_child_session' (Kind-PIN-Login)
 *   → Kein U gefunden: Redirect zur Landing Page (/)
 *
 * Nach erfolgreicher Auth: AI-Keys laden, Sidebar rendern, Dashboard anzeigen.
 * @async
 * @returns {Promise<void>}
 */
async function init() {
  load();

  // PIN aus Kind-Session wiederherstellen (auch nach Reload, wenn U aus localStorage kommt)
  try {
    const cs = sessionStorage.getItem('sb_child_session');
    if (cs) _childPin = JSON.parse(cs).pin || null;
  } catch(e) {}

  // 1. Supabase-Session prüfen (echter Login)
  if (sb) {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      // Profil aus DB laden
      const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
      // Kinder laden falls Elternteil
      let children = [];
      if (profile?.role === 'parent') {
        const { data: ch } = await sb.from('children').select('*').eq('parent_id', session.user.id);
        children = ch || [];
      }
      U = {
        id: session.user.id,
        email: session.user.email,
        full_name: profile?.full_name || session.user.email,
        role: profile?.role || 'student',
        grade: profile?.grade || 9,
        school: profile?.school || 'Gymnasium',
        school_id:   profile?.school_id   || null,
        class_name:  profile?.class_name  || '',
        subscription: profile?.subscription || 'free',
        language: profile?.language || 'de',
        children,
      };
      save();
    }
  }

  // 2. sessionStorage aus frischem Login (Weiterleitung von index.html)
  if (!U) {
    const sbSession = sessionStorage.getItem('sb_session');
    if (sbSession) {
      sessionStorage.removeItem('sb_session');
      const { user, profile } = JSON.parse(sbSession);
      U = {
        id: user.id, email: user.email,
        full_name: profile?.full_name || user.user_metadata?.full_name || user.email,
        role: profile?.role || user.user_metadata?.role || 'student',
        grade: profile?.grade || user.user_metadata?.grade || 9,
        school: profile?.school || user.user_metadata?.school || 'Gymnasium',
        school_id:  profile?.school_id  || null,
        class_name: profile?.class_name || '',
        subscription: 'free', children: [],
      };
      save();
    }
  }

  // 3. Kind-Session (PIN-Login von Landing-Page)
  if (!U) {
    const childSession = sessionStorage.getItem('sb_child_session');
    if (childSession) {
      const c = JSON.parse(childSession);
      _childPin = c.pin || null; // im Speicher halten für PIN-verifizierte Cloud-Sync-RPCs
      U = {
        id: c.child_id,
        email: '',
        full_name: c.child_name,
        role: 'student',
        grade: c.grade || 9,
        school: 'Gymnasium',
        subscription: 'free',
        children: [],
        isChild: true,
        parentEmail: c.parent_email,
        language: c.language || 'de',
        schoolUrl: c.school_url || '',
        subjects: c.subjects || null,
      };
      save();
    }
  }

  if (!U) { window.location.href = '/'; return; }

  // AI-Keys laden: Kind erbt Keys vom Elternteil, sonst eigene Keys
  if (U.isChild && U.parentEmail) {
    loadAIKeys(U.parentEmail);
  } else {
    loadAIKeys(U.email);
  }

  // Konfigurierte Provider aus Supabase DB laden (Auth-Nutzer)
  // Wird geawaitert damit hasActiveKey() sofort korrekt ist (z.B. in Prüfungsmodus)
  await loadConfiguredProviders();

  // Daten für aktuellen User laden: erst lokal (Offline-Cache), dann Cloud (Quelle der Wahrheit)
  loadDataForUser(U.id);
  const migrate = await loadCloudData();
  _dataLoaded = true;                 // ab jetzt dürfen save()/sync* in die Cloud schreiben
  try { localStorage.setItem(_dataKey(), JSON.stringify(D)); } catch(e) {} // Cloud-Daten in Offline-Cache spiegeln
  if (migrate) _syncDataNow();        // lokale Bestandsdaten einmalig in die leere Cloud hochladen

  document.getElementById('app').style.display = 'flex';
  renderSidebar();
  _updateLogBadge(); // Fehler-Badge aus vorherigen Sessions anzeigen
  goPage('dashboard');
  maybeOnboarding(); // einmaliges Willkommens-Onboarding für neue Nutzer (P2.3)
  maybeNotifyDue();  // lokale Erinnerung an fällige Karten (P1.1, nur wenn erlaubt)
  if (location.search.includes('code=') || location.search.includes('error=')) msHandleRedirect(); // Schul-Login-Rückleitung
}

/**
 * Navigiert zu einer Seite und rendert den Inhalt im #content-Container.
 * Unterstützt sowohl synchrone als auch asynchrone Render-Funktionen.
 * Async-Fehler werden über einen gemeinsamen Fehler-Handler angezeigt.
 *
 * @param {string} page   — Seitenname ('dashboard' | 'flashcards' | 'tutor' | ...)
 * @param {Object} [params={}] — Optionale Parameter für die Render-Funktion
 */
function goPage(page, params={}) {
  _page = page;
  closeSidebar();
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const content = document.getElementById('content');
  content.innerHTML = '<div style="max-width:900px;margin:0 auto;"><div class="skeleton" style="height:32px;width:240px;margin-bottom:8px;"></div><div class="skeleton" style="height:16px;width:160px;margin-bottom:24px;"></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:24px;">' + '<div class="skeleton" style="height:96px;"></div>'.repeat(4) + '</div><div class="skeleton" style="height:200px;"></div></div>';

  const pages = {
    dashboard, subjects, flashcards, tutor, exam, planner, pomodoro,
    parent: parentDash, children: childrenPage, teacher: teacherDash,
    subscription, settings
  };

  const render = pages[page];
  if (!render) { goPage('dashboard'); return; }

  const pageTitleKeys = {
    dashboard:'page.dashboard', subjects:'page.subjects', flashcards:'page.flashcards',
    tutor:'page.tutor', exam:'page.exam', planner:'page.planner', pomodoro:'page.pomodoro',
    parent:'page.dashboard', children:'Kinder', teacher:'Lehrer-Dashboard',
    subscription:'page.subscription', settings:'page.settings'
  };
  const titles = {
    dashboard:'Dashboard', subjects:'Fächer', flashcards:'Karteikarten', tutor:'KI-Tutor',
    exam:'Prüfungsmodus', planner:'Lernplan', pomodoro:'Pomodoro',
    parent:'Eltern-Übersicht', children:'Kinder', teacher:'Lehrer-Dashboard',
    subscription:'Abo & Preise', settings:'Einstellungen'
  };
  const pageTitle = pageTitleKeys[page] ? t(pageTitleKeys[page]) : (titles[page] || page);
  document.getElementById('header-title').textContent = pageTitle;
  document.title = pageTitle + ' — StudyBuddy Pro';

  // Fehler-Rendering (synchron + asynchron)
  const _routerError = (e) => {
    console.error('[Router]', e);
    content.innerHTML = `<div style="text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:16px">⚠️</div>
      <h2>${t('common.error_loading')}</h2>
      <p style="color:var(--t3);margin-top:8px">${safe(e.message)}</p>
      <button class="btn btn-primary" style="margin-top:24px" onclick="goPage('dashboard')">${t('common.back_dashboard')}</button>
    </div>`;
  };
  try {
    // render() kann synchron (void) oder asynchron (Promise) sein
    const ret = render(content, params);
    if (ret instanceof Promise) ret.catch(_routerError);
  } catch(e) { _routerError(e); }
}

      title: t('focus.exam_title', safe(exam.name), daysTxt),
      sub: t('focus.exam_sub', exam.total - exam.mastered),

      title: t('focus.due_title', dueCards), sub: t('focus.due_sub'),
      cta: t('focus.due_cta'), onclick: `goPage('flashcards')` };

      cta: t('focus.empty_cta'), onclick: `goPage('flashcards')` };

let FC = { subj:null, idx:0, flipped:false, topic:'Alle', exam:null, mode:'learn', answered:null, mcOpts:null, mcCorrectIdx:-1, mcCard:null, mcForKey:'', confidence:null };

function _shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
/** 4 Multiple-Choice-Optionen: richtige Rückseite + 3 plausible Ablenker (bevorzugt gleiches Thema). */
function _mcOptions(card, subj){
  const correct = card.back;
  const all = (D.cards[subj]||[]).filter(c=>c.id!==card.id && c.back && c.back!==correct);
  let cand = [...new Set(all.filter(c=>card.topic && c.topic===card.topic).map(c=>c.back))];
  if (cand.length < 3) cand = [...new Set([...cand, ...all.map(c=>c.back)])];
  _shuffle(cand);
  return _shuffle([correct, ...cand.slice(0,3)]);
}
/** Wechselt zwischen Lern- (Aufdecken) und Test- (Multiple-Choice) Modus. */
function setFCMode(m){ FC.mode = (m==='test'?'test':'learn'); FC.answered=null; FC.mcOpts=null; FC.mcForKey=''; FC.flipped=false; FC.idx=0; renderFC(document.getElementById('content')); }
/** Beantwortet die MC-Frage (Index der gewählten Option). */
function mcPick(i){ if(FC.answered!=null) return; FC.answered=i; renderFC(document.getElementById('content')); }
/** Nächste Frage: bewertet die Karte (richtig→Ok, falsch→Nochmal) → speist Spaced-Repetition. */
function mcNext(){ const correct = FC.answered===FC.mcCorrectIdx; const id=FC.mcCard; FC.answered=null; FC.mcOpts=null; FC.mcForKey=''; if(id) rateCard(id, FC.subj, correct?2:0); }
/** HTML für eine MC-Testfrage (Frage + 4 Optionen + Feedback). */
function _mcBlockHTML(card, due, mc){
  if (mc && mc.tooFew) return `<div style="max-width:560px;margin:0 auto;"><div class="card" style="text-align:center;padding:32px;color:var(--t3);">${t('test.need_more')}</div></div>`;
  return `<div style="max-width:560px;margin:0 auto;">
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3);text-align:center;margin-bottom:8px;">${t('test.question')} ${FC.idx+1}/${due.length}${card.topic?` · 📂 ${safe(card.topic)}`:''}</div>
    <div class="card" style="padding:28px;text-align:center;font-size:18px;font-weight:600;line-height:1.5;margin-bottom:16px;">${safe(card.front)}</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${mc.opts.map((o,i)=>{
        let bg='var(--bg-card)', bd='var(--border)';
        if (mc.answered!=null){
          if (i===mc.correctIdx){ bg='rgba(16,185,129,.15)'; bd='var(--success)'; }
          else if (i===mc.answered){ bg='rgba(239,68,68,.15)'; bd='var(--danger)'; }
        }
        return `<button onclick="mcPick(${i})" ${mc.answered!=null?'disabled':''} style="text-align:left;padding:14px 16px;background:${bg};border:2px solid ${bd};border-radius:var(--r-md);font-size:14px;line-height:1.4;cursor:${mc.answered!=null?'default':'pointer'};color:var(--t1);">${String.fromCharCode(65+i)}) ${safe(o)}</button>`;
      }).join('')}
    </div>
    ${mc.answered!=null ? `<div style="text-align:center;margin-top:16px;">
      <div style="font-weight:700;margin-bottom:10px;color:${mc.answered===mc.correctIdx?'var(--success)':'var(--danger)'};">${mc.answered===mc.correctIdx?('✅ '+t('test.correct')):('❌ '+t('test.wrong'))}</div>
      ${mc.answered!==mc.correctIdx?`<div style="font-size:13px;color:var(--t2);margin-bottom:10px;">${t('test.correct_was')} <b>${safe(card.back)}</b></div>`:''}
      ${_explainHTML(card)}
      <button class="btn btn-primary" onclick="mcNext()" style="margin-top:14px;">${t('test.next')} →</button>
    </div>` : ''}
  </div>`;
}

/** Startet den Prüfungs-Lernmodus für eine Prüfung (Key = "name|date"; übt alle Karten, wenigst Beherrschtes zuerst). */
function prepExam(key) {
  if (!key) return;
  const i = key.lastIndexOf('|');
  const name = key.slice(0, i), date = key.slice(i + 1);
  FC.exam = key;
  for (const subj in (D.cards || {})) {
    if ((D.cards[subj] || []).some(c => c.examName === name && c.examDate === date)) { FC.subj = subj; break; }
  }
  FC.topic = 'Alle'; FC.idx = 0; FC.flipped = false;
  goPage('flashcards');
}
/** Beendet den Prüfungs-Lernmodus. */
function exitExamPrep() {
  FC.exam = null; FC.idx = 0; FC.flipped = false;
  renderFC(document.getElementById('content'));
}

/** Distinkte Themen eines Fachs (sortiert). */
function _topics(subj) {
  const set = new Set();
  (D.cards[subj] || []).forEach(c => { if (c.topic) set.add(c.topic); });
  return [...set].sort((a, b) => a.localeCompare(b, 'de'));
}
/** Hat das Fach Karten ohne Thema (Allgemein)? */
function _hasUncategorized(subj) {
  return (D.cards[subj] || []).some(c => !c.topic);
}
/** Passt die Karte zum aktuell gewählten Thema-Filter? ('Alle' | '' = Allgemein | Thema) */
function _cardInTopic(c) {
  if (FC.topic === 'Alle') return true;
  if (FC.topic === '') return !c.topic;
  return c.topic === FC.topic;
}
/** Liest das Thema-Feld im Erstellen-Bereich (max. 80 Zeichen) oder null. */
function _newTopic() {
  const v = document.getElementById('new-topic')?.value.trim();
  return v ? v.slice(0, 80) : null;
}

/** Gilt eine Karte als „beherrscht"? (3× hintereinander richtig — reps wird bei Fehler zurückgesetzt) */
function _isMastered(c) { return (c.reps || 0) >= 3; }

/**
 * Beherrschungs-Statistik für die aktuell sichtbare Kartenmenge (Fach+Thema bzw. Prüfung).
 * @returns {{total:number, mastered:number, pct:number}}
 */
function _masteryStats() {
  let pool;
  if (FC.exam) pool = (D.cards[FC.subj] || []).filter(c => (c.examName + '|' + c.examDate) === FC.exam);
  else pool = (D.cards[FC.subj] || []).filter(_cardInTopic);
  const total = pool.length;
  const mastered = pool.filter(_isMastered).length;
  return { total, mastered, pct: total ? Math.round((mastered / total) * 100) : 0 };
}

/** Selbsteinschätzung vor dem Aufdecken setzen und Karte umdrehen (Metakognition). */
function fcReveal(conf) {
  FC.confidence = conf || null;
  FC.flipped = true;
  renderFC(document.getElementById('content'));
}

/** HTML des Erklär-Blocks („💡 Warum") für eine Karte — vorhandene Erklärung oder On-demand-Button. */
function _explainHTML(card, opts) {
  const boxed = opts?.boxed !== false;
  if (card.explain) {
    return `<div style="${boxed ? 'background:var(--pri-l);border-radius:var(--r-md);padding:10px 12px;' : ''}text-align:left;font-size:13px;line-height:1.45;color:var(--pri-d);margin-top:12px;">💡 <b>${t('fc.why')}</b> ${safe(card.explain)}</div>`;
  }
  if (!hasActiveKey()) return '';
  return `<button class="btn btn-secondary btn-sm" onclick="explainCard('${card.id}')" style="margin-top:12px;">💡 ${t('fc.explain_btn')}</button>`;
}

/** Formatiert ein YYYY-MM-DD-Datum lokalisiert (kurz). */
function _fmtDate(d) {
  if (!d) return '';
  try { return new Date(d + 'T00:00:00').toLocaleDateString(getCurrentLang?.() || 'de', { day: '2-digit', month: '2-digit', year: '2-digit' }); }
  catch { return d; }
}

/**
 * Leitet Prüfungen aus den Karten ab (gruppiert nach Name+Datum, fachübergreifend).
 * @param {{includePast?:boolean}} [opts]
 * @returns {Array} { name, date, subject, key, cards, total, mastered, daysLeft }
 */
function _exams(opts) {
  const map = new Map();
  for (const subj in (D.cards || {})) {
    for (const c of (D.cards[subj] || [])) {
      if (!c.examName || !c.examDate) continue;
      const key = c.examName + '|' + c.examDate;
      let e = map.get(key);
      if (!e) { e = { name: c.examName, date: c.examDate, key, subjects: new Set(), total: 0, mastered: 0 }; map.set(key, e); }
      e.total++; if ((c.reps || 0) >= 2) e.mastered++; e.subjects.add(subj);
    }
  }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let list = [...map.values()].map(e => ({
    ...e, subject: [...e.subjects].join(', '),
    daysLeft: Math.ceil((new Date(e.date + 'T00:00:00').getTime() - today.getTime()) / 86400000),
  }));
  if (!opts?.includePast) list = list.filter(e => e.daysLeft >= 0);
  return list.sort((a, b) => a.date.localeCompare(b.date));
}

/** Liest die Prüfungs-Auswahl im Erstellen-Bereich: {name, date} oder null. */
function _newExam() {
  const sel = document.getElementById('new-exam');
  if (!sel) return null;
  if (sel.value === '__new__') {
    const name = document.getElementById('new-exam-name')?.value.trim();
    const date = document.getElementById('new-exam-date')?.value;
    return (name && date) ? { name: name.slice(0, 100), date } : null;
  }
  if (sel.value && sel.value.includes('|')) {
    const i = sel.value.lastIndexOf('|');
    return { name: sel.value.slice(0, i), date: sel.value.slice(i + 1) };
  }
  return null;
}

function flashcards(el, params={}) {
  const subs = getChildSubjects();
  FC.subj = params.subject || FC.subj || subs[0];
  renderFC(el);
}

/**
 * Bewertet eine Karteikarte nach dem SM-2-ähnlichen Spaced-Repetition-Algorithmus.
 * Passt Level und nächstes Fälligkeitsdatum an, vergibt XP und rendert neu.
 * @param {string} id     — Karten-ID
 * @param {string} subj   — Fachname
 * @param {0|1|2|3} rating — 0=Falsch, 1=Schwer, 2=Ok, 3=Leicht
 */
function rateCard(id, subj, rating) {
  const cards = D.cards[subj]||[];
  const card = cards.find(c=>c.id===id) || cards[FC.idx];
  if (!card) return;

  // SM-2-Adaption (rating: 0=Falsch, 1=Schwer, 2=Ok, 3=Leicht) — karten-individuelle Intervalle
  let ease = card.ease || 2.5, reps = card.reps || 0, intv = card.interval || 0;
  if (rating === 0)      { reps = 0; intv = 1; ease = Math.max(1.3, ease - 0.20); }
  else if (rating === 1) { reps += 1; ease = Math.max(1.3, ease - 0.15); intv = intv > 0 ? Math.max(1, Math.round(intv * 1.2)) : 1; }
  else if (rating === 2) { reps += 1; intv = reps === 1 ? 1 : reps === 2 ? 6 : Math.round(intv * ease); }
  else                   { reps += 1; ease += 0.15; intv = reps === 1 ? 4 : Math.round((intv > 0 ? intv : 6) * ease * 1.3); }
  intv = Math.max(1, Math.min(intv, 365)); // Kappung 1..365 Tage
  card.ease = Math.round(ease * 100) / 100;
  card.reps = reps;
  card.interval = intv;
  card.level = Math.max(0, Math.min(4, reps)); // grober Anzeige-Proxy (UI-Kompatibilität)
  card.due = Date.now() + intv * 86400000;
  // Lernplan: Prüfungs-Karten spätestens am Prüfungstag wieder fällig (bis dahin in Wiederholung halten)
  if (card.examName && card.examDate) {
    const examMs = new Date(card.examDate + 'T23:59:59').getTime();
    if (examMs > Date.now() && card.due > examMs) card.due = examMs;
  }

  D.correct = (D.correct||0) + (rating >= 2 ? 1 : 0);
  D.total = (D.total||0) + 1;
  D.xp = (D.xp||0) + (rating >= 2 ? CFG.XP.CARD : CFG.XP.CARD_WRONG);
  recordSession(subj, 'flashcard', null, rating >= 2 ? CFG.XP.CARD : CFG.XP.CARD_WRONG);
  save(); updateXP();

  const pool = FC.exam
    ? (D.cards[subj]||[]).filter(c => (c.examName+'|'+c.examDate) === FC.exam)
    : (D.cards[subj]||[]).filter(c => (c.due||0)<=Date.now() && _cardInTopic(c));
  if (pool.length) FC.idx = (FC.idx + 1) % pool.length;
  // Kalibrierungs-Rückmeldung (Metakognition): Selbsteinschätzung vs. tatsächliches Ergebnis
  if (FC.confidence === 'sure' && rating === 0) toast(t('fc.calib_over'), 3500);
  else if (FC.confidence === 'unsure' && rating >= 2) toast(t('fc.calib_under'), 3500);
  FC.flipped = false; FC.confidence = null;
  renderFC(document.getElementById('content'));
}

/** Findet eine Karte per ID (fachübergreifend). */
function _findCard(id) {
  for (const s in (D.cards || {})) { const c = (D.cards[s] || []).find(x => x.id === id); if (c) return c; }
  return null;
}

/**
 * Erzeugt on-demand eine kurze KI-Erklärung ("warum die Antwort stimmt") für eine Karte
 * und cacht sie dauerhaft auf der Karte (card.explain). Braucht einen aktiven KI-Key.
 * @param {string} id — Karten-ID
 */
async function explainCard(id) {
  const card = _findCard(id);
  if (!card) return;
  if (!hasActiveKey()) return toast(t('toast.need_api_key'));
  toast(t('fc.explaining'));
  try {
    const sys = `Lern-Tutor für Klasse ${U.grade}. Erkläre kindgerecht, knapp, ermutigend.`;
    const r = await ai([{ role: 'user', content: `Fach ${FC.subj}. Erkläre in 1-2 kurzen Sätzen kindgerecht, WARUM auf die Frage "${card.front}" die Antwort "${card.back}" richtig ist — als Begründung/Merkhilfe, ohne die Antwort bloß zu wiederholen. Antworte nur mit dem Erklärtext.` }], sys, 300);
    const txt = (r || '').trim().replace(/^["']|["']$/g, '').slice(0, 400);
    if (txt) { card.explain = txt; save(); renderFC(document.getElementById('content')); }
    else toast('❌ ' + t('fc.explain_fail'));
  } catch (e) { toast(/key|schlüssel/i.test(e.message) ? '🔑 ' + t('toast.need_key_long') : '❌ ' + e.message, 6000); }
}

function manualAddCard() {
  const front = document.getElementById('nf')?.value.trim();
  const back = document.getElementById('nb')?.value.trim();
  if (!front || !back) return toast(t('toast.fill_card'));
  const topic = _newTopic(); const ex = _newExam();
  if (!D.cards[FC.subj]) D.cards[FC.subj] = [];
  D.cards[FC.subj].push({id:'c'+Date.now(),front,back,level:0,due:0,topic,examName:ex?.name||null,examDate:ex?.date||null});
  if (topic) FC.topic = topic; // direkt ins neue Thema wechseln
  save(); toast(t('toast.card_added'));
  document.getElementById('nf').value=''; document.getElementById('nb').value='';
  renderFC(document.getElementById('content'));
}

/** Ordnet eine Karte einer (bestehenden) Prüfung zu — oder entfernt die Zuordnung ('' ). */
function assignCardExam(id, key) {
  let name = null, date = null;
  if (key && key.includes('|')) { const i = key.lastIndexOf('|'); name = key.slice(0, i); date = key.slice(i + 1); }
  for (const subj in D.cards) {
    const c = (D.cards[subj] || []).find(x => x.id === id);
    if (c) { c.examName = name; c.examDate = date; save(); break; }
  }
  manageCards();
}

/** Verschiebt eine Karte in ein (anderes) Thema. */
function moveCardTopic(id, topic) {
  const tp = topic.trim() ? topic.trim().slice(0, 80) : null;
  for (const subj in D.cards) {
    const c = (D.cards[subj] || []).find(x => x.id === id);
    if (c) { c.topic = tp; save(); break; }
  }
  manageCards(); // neu aufbauen (Karte erscheint in neuer Gruppe)
}

/** Löscht eine Karte (mit Bestätigung) und aktualisiert das Verwalten-Modal. */
function deleteCardById(id) {
  if (!confirm(t('fc.delete_confirm'))) return;
  for (const subj in D.cards) {
    const arr = D.cards[subj] || [];
    const next = arr.filter(x => x.id !== id);
    if (next.length !== arr.length) { D.cards[subj] = next; save(); break; }
  }
  manageCards();
  if (_page === 'flashcards') renderFC(document.getElementById('content'));
}

/**
 * Generiert Karteikarten aus einem Freitext via KI.
 * Parst das JSON-Array aus der KI-Antwort und fügt die Karten dem aktuellen Fach hinzu.
 * @async
 * @returns {Promise<void>}
 */
async function genCards() {
  const text = document.getElementById('gen-t')?.value.trim();
  if (!text) return toast(t('toast.enter_text'));
  if (!hasActiveKey()) return toast(t('toast.need_api_key'));
  const num = parseInt(document.getElementById('gen-n')?.value||5);
  const userTopic = _newTopic(); const ex = _newExam();
  toast('🤖 KI erstellt Karten…');
  try {
    const sys = `Karteikarten-Ersteller für Klasse ${U.grade}. Antworte NUR mit JSON.`;
    const topicHint = userTopic ? '' : ' Ordne jede Karte einem kurzen Lernthema zu (Feld "topic").';
    const r = await ai([{role:'user',content:`${num} Karteikarten zu ${FC.subj} aus:\n${text.slice(0,2000)}.${topicHint} Ergänze je Karte eine kurze kindgerechte Begründung/Merkhilfe (Feld "explain", 1 Satz, WARUM die Antwort stimmt).\nNur JSON:[{"front":"Frage?","back":"Antwort","topic":"Thema","explain":"Begründung"}]`}], sys, 1600);
    const parsed = JSON.parse(r.match(/\[[\s\S]*\]/)?.[0]||'[]');
    if (!parsed.length) throw new Error('Kein gültiges JSON');
    if (!D.cards[FC.subj]) D.cards[FC.subj] = [];
    parsed.forEach(c=>{ if(c.front&&c.back) D.cards[FC.subj].push({id:'c'+Date.now()+Math.random(),front:c.front,back:c.back,level:0,due:0,topic:userTopic||(c.topic?String(c.topic).slice(0,80):null),examName:ex?.name||null,examDate:ex?.date||null,explain:c.explain?String(c.explain).slice(0,400):null}); });
    if (userTopic) FC.topic = userTopic;
    save(); toast(`🎉 ${parsed.length} Karten erstellt!`);
    document.getElementById('gen-t').value='';
    renderFC(document.getElementById('content'));
  } catch(e) { toast(/key|schlüssel/i.test(e.message) ? '🔑 '+t('toast.need_key_long') : '❌ '+e.message, 7000); }
}

/**
 * Erstellt Karteikarten aus einem hochgeladenen Bild/PDF (Foto eines Arbeitsblatts,
 * Buchseite o.ä.) via Vision-KI. PDF wird nur von Claude unterstützt.
 * @param {HTMLInputElement} input — das <input type="file">
 */
async function genCardsFromImage(input) {
  const file = input?.files?.[0];
  if (!file) return;
  if (!hasActiveKey()) { input.value=''; return toast(t('toast.need_api_key')); }
  const isPdf = file.type === 'application/pdf';
  if (!/^image\//.test(file.type) && !isPdf) { input.value=''; return toast('❌ Nur Bilder (JPG/PNG) oder PDF'); }
  if (isPdf && AI.provider !== 'claude') { input.value=''; return toast('❌ PDF nur mit Claude — sonst bitte ein Foto verwenden'); }
  if (file.size > 6*1024*1024) { input.value=''; return toast('❌ Datei zu groß (max. 6 MB)'); }

  const userTopic = _newTopic(); const ex = _newExam();
  toast('🤖 KI liest die Datei…');
  try {
    const dataUrl = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
    const b64 = String(dataUrl).split(',')[1] || '';
    const sys = `Karteikarten-Ersteller für Klasse ${U.grade}. Antworte NUR mit kompaktem JSON, kein Text drumherum.`;
    // Foto = alle erkennbaren Aufgaben erfassen (KEINE feste Anzahl — die 3/5/8-Auswahl ist nur fürs Üben)
    const topicHint = userTopic ? '' : ' Ordne jede Karte einem kurzen Lernthema/Kapitel zu (Feld "topic").';
    const prompt = `Erstelle aus dieser Seite Karteikarten für das Fach ${FC.subj}: für JEDE erkennbare Aufgabe, jeden Begriff bzw. jedes Frage-Antwort-/Vokabel-Paar genau EINE Karte. Erfasse ALLE, lass nichts aus, fasse nichts zusammen.${topicHint} Vorderseite = Aufgabe/Frage, Rückseite = Lösung/Antwort. Ergänze je Karte eine kurze kindgerechte Begründung/Merkhilfe (Feld "explain", 1 Satz, WARUM die Antwort stimmt). Antworte NUR mit einem JSON-Array: [{"front":"...","back":"...","topic":"Thema","explain":"Begründung"}]`;
    const r = await ai([{role:'user',content:prompt}], sys, 4000, false, { mime: isPdf?'application/pdf':file.type, data: b64 });
    const parsed = JSON.parse(r.match(/\[[\s\S]*\]/)?.[0]||'[]');
    if (!parsed.length) throw new Error('Keine Karten erkannt — anderes Foto versuchen');
    if (!D.cards[FC.subj]) D.cards[FC.subj] = [];
    let n=0; parsed.forEach(c=>{ if(c.front&&c.back){ D.cards[FC.subj].push({id:'c'+Date.now()+Math.random(),front:c.front,back:c.back,level:0,due:0,topic:userTopic||(c.topic?String(c.topic).slice(0,80):null),examName:ex?.name||null,examDate:ex?.date||null,explain:c.explain?String(c.explain).slice(0,400):null}); n++; } });
    if (userTopic) FC.topic = userTopic;
    save(); toast(`🎉 ${n} Karten aus Datei erstellt!`);
    renderFC(document.getElementById('content'));
  } catch(e) { toast(/key|schlüssel/i.test(e.message) ? '🔑 '+t('toast.need_key_long') : '❌ '+e.message, 7000); }
  finally { if (input) input.value=''; }
}

/**
 * Sendet eine Nutzernachricht an den KI-Tutor und zeigt die Antwort im Chat an.
 * Verwaltet den lokalen Gesprächsverlauf (tutorMsgs) — max. 6 Messages im Kontext.
 * @async
 * @returns {Promise<void>}
 */
async function sendMsg() {
  const inp = document.getElementById('chat-in');
  const text = inp?.value.trim();
  if (!text) return;
  if (!hasActiveKey()) return toast(t('toast.need_api_key'));
  inp.value = '';

  const msgs = document.getElementById('chat-msgs');
  msgs.innerHTML += `<div style="background:var(--pri);color:white;padding:12px 16px;border-radius:var(--r-md);max-width:85%;align-self:flex-end;font-size:14px;">${safe(text)}</div>`;
  msgs.innerHTML += `<div id="typing" style="color:var(--t3);font-size:13px;animation:pulse 1s infinite;">${t('tutor.typing')}</div>`;
  msgs.scrollTop = msgs.scrollHeight;

  tutorMsgs.push({role:'user', content:text});

  try {
    const sys = buildTutorPrompt(tutorSubj, U.grade, getCurrentLang());
    const history = tutorMsgs.slice(-6).map(m=>({role:m.role,content:m.content.slice(0,400)}));
    const answer = await ai(history, sys, 400, false);
    document.getElementById('typing')?.remove();
    tutorMsgs.push({role:'assistant',content:answer});
    msgs.innerHTML += `<div style="background:var(--bg-2);padding:12px 16px;border-radius:var(--r-md);max-width:85%;font-size:14px;line-height:1.6;">${safeHTML(answer.replace(/\n/g,'<br>'))}</div>`;
    D.xp = (D.xp||0) + CFG.XP.TUTOR; recordSession(tutorSubj, 'tutor', null, CFG.XP.TUTOR); save(); updateXP();
  } catch(e) {
    document.getElementById('typing')?.remove();
    msgs.innerHTML += `<div style="background:#fee2e2;color:#991b1b;padding:12px 16px;border-radius:var(--r-md);max-width:85%;font-size:13px;">❌ ${safe(e.message)}</div>`;
  }
  msgs.scrollTop = msgs.scrollHeight;
}

/**
 * Startet eine neue Prüfung: generiert Fragen via KI (wenn Key vorhanden)
 * oder nutzt Fallback-Beispielfragen. Setzt EX-State und rendert die erste Frage.
 * @async
 * @returns {Promise<void>}
 */
async function startExam() {
  const subj = document.getElementById('ex-subj')?.value;
  const num = parseInt(document.getElementById('ex-num')?.value||5);
  const el = document.getElementById('content');
  el.innerHTML = `<div style="text-align:center;padding:60px"><div class="spinner" style="width:32px;height:32px;"></div><p style="margin-top:16px;color:var(--t3);">${t('exam.generating')}</p></div>`;

  let qs = [];
  if (hasActiveKey()) {
    try {
      const { sys, user: userMsg } = buildExamPrompt(subj, U.grade, getCurrentLang(), num);
      const r = await ai([{role:'user', content: userMsg}], sys, 2000);
      qs = JSON.parse(r.match(/\[[\s\S]*\]/)?.[0]||'[]')
        .filter(q => q.q && q.opts?.length === 4)
        .map(q => ({ ...q, correct: parseInt(q.correct, 10) || 0 })); // normalize to number
    } catch(e) { toast('❌ '+e.message); }
  }

  // Fallback: echte Lernfragen aus FALLBACK_QS wenn keine KI oder KI-Fehler
  if (!qs.length) {
    const bank = FALLBACK_QS[subj] || FALLBACK_QS['default'];
    qs = [...bank].sort(() => Math.random() - .5).slice(0, Math.min(num, bank.length));
  }

  EX = { active:true, qs, idx:0, score:0, subj, answered:false };
  try {
    renderExam(el);
  } catch(e) {
    console.error('[startExam renderExam]', e);
    if (el) el.innerHTML = `<div class="card" style="text-align:center;padding:40px;"><p style="color:var(--error);">❌ ${t('common.error_loading')}: ${safe(e.message)}</p><button class="btn btn-primary" style="margin-top:16px;" onclick="goPage('exam')">${t('exam.error_back')}</button></div>`;
  }
}

function renderExam(el) {
  if (EX.idx >= EX.qs.length) { endExam(el); return; }
  const q = EX.qs[EX.idx];
  const pct = Math.round((EX.idx)/EX.qs.length*100);
  el.innerHTML = `
    <div class="page-header"><h1>📝 ${safe(EX.subj)} — ${t('exam.question')} ${EX.idx+1}/${EX.qs.length}</h1></div>
    <div style="max-width:600px;margin:0 auto;">
      <div class="progress" style="margin-bottom:20px;"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="card" style="margin-bottom:16px;">
        <p style="font-size:17px;font-weight:600;line-height:1.5;" id="q-text">${safe(q.q)}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;" id="opts">
        ${q.opts.map((o,i)=>`
          <button class="btn btn-secondary" onclick="answerQ(${i})" style="text-align:left;justify-content:flex-start;padding:14px 18px;">
            <span style="width:24px;height:24px;border-radius:50%;background:var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;">${['A','B','C','D'][i]}</span>
            ${safe(o)}
          </button>`).join('')}
      </div>
    </div>`;
}

/**
 * Verarbeitet die Antwort auf eine Prüfungsfrage.
 * Markiert richtige Antwort grün, falsche rot. Nach 1,2s nächste Frage.
 * @param {number} i — Index der gewählten Option (0–3)
 */
function answerQ(i) {
  if (EX.answered) return; // Doppelklick-Schutz
  EX.answered = true;

  const q = EX.qs[EX.idx];
  const correct = i === q.correct;
  if (correct) EX.score++;

  const btns = document.querySelectorAll('#opts button');
  btns.forEach((b,j) => {
    b.disabled = true;
    if (j === q.correct) { b.style.background = '#d1fae5'; b.style.borderColor = '#10b981'; }
    if (j === i && !correct) { b.style.background = '#fee2e2'; b.style.borderColor = '#ef4444'; }
  });

  setTimeout(() => {
    EX.idx++;
    EX.answered = false; // Guard zurücksetzen für nächste Frage
    renderExam(document.getElementById('content'));
  }, 1200);
}

function endExam(el) {
  EX.active = false;
  const pct = Math.round(EX.score/EX.qs.length*100);
  const emoji = pct >= 80 ? '🏆' : pct >= 60 ? '👍' : '💪';
  const msg = pct >= 80 ? t('exam.excellent') : pct >= 60 ? t('exam.good') : t('exam.practice');

  D.exams = [...(D.exams||[]), {id:'e'+Date.now(),subject:EX.subj,score:EX.score,total:EX.qs.length,date:new Date().toISOString()}];
  D.xp = (D.xp||0) + CFG.XP.EXAM; recordSession(EX.subj, 'exam', null, CFG.XP.EXAM); save(); updateXP();

  el.innerHTML = `

}

let PO = { running:false, work:25, break:5, sec:0, isBreak:false, timer:null, sessions:0 };

function pomodoro(el) {
  clearInterval(PO.timer); PO.timer=null;
  PO.sec = PO.work * 60; PO.isBreak=false; PO.running=false;
  renderPomo(el);
}

function renderPomo(el) {
  const min = Math.floor(PO.sec/60).toString().padStart(2,'0');
  const sec = (PO.sec%60).toString().padStart(2,'0');
  const progress = PO.isBreak ? (1-(PO.sec/(PO.break*60)))*100 : (1-(PO.sec/(PO.work*60)))*100;
  el.innerHTML = `
    <div class="page-header"><h1>${t('pomo.title')}</h1><p>${t('pomo.subtitle')}</p></div>
    <div style="max-width:400px;margin:0 auto;text-align:center;">
      <div class="card" style="padding:40px;">
        <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:${PO.isBreak?'var(--acc-green)':'var(--pri)'};margin-bottom:16px;">
          ${PO.isBreak?t('pomo.break'):t('pomo.focus')} · ${t('pomo.session')} ${PO.sessions+1}
        </div>
        <div style="font-size:64px;font-weight:800;letter-spacing:-2px;color:var(--t1);font-variant-numeric:tabular-nums;">${min}:${sec}</div>
        <div class="progress" style="margin:20px 0;height:8px;"><div class="progress-bar" style="width:${progress}%;background:${PO.isBreak?'var(--acc-green)':'var(--pri)'}"></div></div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:8px;">
          <button class="btn btn-primary btn-lg" onclick="togglePomo()">${PO.running?t('pomo.pause_btn'):t('pomo.start_btn')}</button>
          <button class="btn btn-secondary" onclick="resetPomo()">${t('pomo.reset')}</button>
        </div>
      </div>
      <div class="card" style="margin-top:16px;">
        <div style="display:flex;justify-content:space-around;">
          <div><div style="font-size:13px;color:var(--t3);">${t('pomo.focus_label')}</div>
            <input type="number" value="${PO.work}" min="5" max="60" class="input" style="width:60px;text-align:center;" onchange="PO.work=parseInt(this.value)||25;if(!PO.running){PO.sec=PO.work*60;renderPomo(document.getElementById('content'));}">
          </div>
          <div><div style="font-size:13px;color:var(--t3);">${t('pomo.break_label')}</div>
            <input type="number" value="${PO.break}" min="1" max="30" class="input" style="width:60px;text-align:center;" onchange="PO.break=parseInt(this.value)||5;">
          </div>
          <div><div style="font-size:13px;color:var(--t3);">${t('pomo.sessions')}</div>
            <div style="font-size:24px;font-weight:700;">${PO.sessions}</div>
          </div>
        </div>
      </div>
    </div>`;
}

function togglePomo() {
  if (PO.running) {
    clearInterval(PO.timer); PO.running=false;
  } else {
    PO.running=true;
    PO.timer = setInterval(()=>{
      PO.sec--;
      if (PO.sec <= 0) {
        if (!PO.isBreak) {
          PO.sessions++; PO.isBreak=true; PO.sec=PO.break*60;
          D.xp=(D.xp||0)+CFG.XP.POMO; recordSession(null, 'pomodoro', PO.work, CFG.XP.POMO); save(); updateXP();
          toast(t('pomo.done', CFG.XP.POMO));
        } else {
          PO.isBreak=false; PO.sec=PO.work*60;
          toast(t('pomo.break_over'));
        }
      }
      if (_page === 'pomodoro') renderPomo(document.getElementById('content'));
    }, 1000);
  }
  if (_page === 'pomodoro') renderPomo(document.getElementById('content'));
}

function resetPomo() {
  clearInterval(PO.timer); PO.running=false; PO.isBreak=false; PO.sec=PO.work*60;
  if (_page === 'pomodoro') renderPomo(document.getElementById('content'));
}

async function parentDash(el) {
  const children = U.children||[];

  // Kinder-Stats aus Supabase nachladen (falls stats-Spalte vorhanden)
  if (sb && children.length) {
    try {
      const { data } = await sb.from('children')
        .select('id, name, grade, stats')
        .eq('parent_id', U.id);
      if (data) {
        data.forEach(row => {
          const c = children.find(x => x.id === row.id);
          if (c && row.stats) c.dbStats = row.stats;
        });
      }
    } catch(e) {}
  }

  // Kinderdaten aus localStorage (selbes Gerät) oder DB-Stats
  function childStats(c) {
    try { return { ...JSON.parse(localStorage.getItem('sb_data_'+c.id)||'{}'), ...(c.dbStats||{}) }; }
    catch { return c.dbStats || {}; }
  }

  // XP der letzten 7 Tage aus Sessions berechnen
  function weeklyXP(c) {
    const st = childStats(c);
    if (st.weeklyXP) return st.weeklyXP; // DB-Wert
    // Aus localStorage sessions berechnen
    const sessions = st.sessions || [];
    const days = Array(7).fill(0);
    const now = Date.now();
    sessions.forEach(s => {
      const d = Math.floor((now - new Date(s.created_at).getTime()) / 86400000);
      if (d >= 0 && d < 7) days[6 - d] += (s.xp_earned || 0);
    });
    return days;
  }

  const COLORS = ['rgba(99,102,241,.75)','rgba(139,92,246,.75)','rgba(16,185,129,.75)','rgba(245,158,11,.75)'];

  // Wochen-Analyse je Kind (deterministisch aus echten Daten — kein KI-Key nötig)
  function analyze(c) {
    const st = childStats(c);
    const cards = st.cards || {};
    let total = 0, mastered = 0; const topicCount = {}, examMap = {};
    for (const subj in cards) {
      for (const cd of (cards[subj] || [])) {
        total++;
        if ((cd.reps || 0) >= 3) mastered++;
        if (cd.topic) topicCount[cd.topic] = (topicCount[cd.topic] || 0) + 1;
        if (cd.examName && cd.examDate) { const k = cd.examName + '|' + cd.examDate; examMap[k] = (examMap[k] || 0) + 1; }
      }
    }
    const topTopic = Object.keys(topicCount).sort((a, b) => topicCount[b] - topicCount[a])[0] || null;
    const wx = weeklyXP(c);
    const weekXP = wx.reduce((s, x) => s + x, 0);
    const activeDays = wx.filter(x => x > 0).length;
    const streak = st.streak || 0;
    const inactiveDays = st.lastStudy ? Math.floor((Date.now() - new Date(st.lastStudy).getTime()) / 86400000) : null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    let exam = null;
    for (const k in examMap) {
      const i = k.lastIndexOf('|'); const name = k.slice(0, i), date = k.slice(i + 1);
      const dl = Math.ceil((new Date(date + 'T00:00:00').getTime() - today.getTime()) / 86400000);
      if (dl >= 0 && (!exam || dl < exam.daysLeft)) exam = { name, date, daysLeft: dl, count: examMap[k] };
    }
    return { st, total, mastered, topTopic, weekXP, activeDays, wx, streak, inactiveDays, exam };
  }

  // Warme, konkrete Gesprächsanstöße (max. 3) — Reihenfolge nach Relevanz
  function starters(a, name) {
    const out = [];
    if (a.exam && a.exam.daysLeft <= 21) out.push(t('parent.cs_exam', name, safe(a.exam.name)));
    if (a.inactiveDays !== null && a.inactiveDays >= 3) out.push(t('parent.cs_inactive', name, a.inactiveDays));
    if (a.topTopic) out.push(t('parent.cs_topic', name, safe(a.topTopic)));
    if (a.mastered >= 5) out.push(t('parent.cs_mastery', name, a.mastered));
    if (a.streak >= 3) out.push(t('parent.cs_streak', name, a.streak));
    out.push(t('parent.cs_general', name));
    return [...new Set(out)].slice(0, 3);
  }

  el.innerHTML = `
    <div class="page-header">
      <h1>${t('parent.title')}</h1>
      <p>${t('parent.subtitle', children.length)}</p>
    </div>
    ${!children.length ? `
      <div class="card" style="text-align:center;padding:48px;">

        <h2>${t('parent.no_children')}</h2>

      ${children.map(c => {
        const a = analyze(c);
        const pct = a.total ? Math.round(a.mastered / a.total * 100) : 0;
        const dots = a.wx.map(x => `<span style="width:9px;height:9px;border-radius:50%;background:${x>0?'var(--success)':'var(--border)'};display:inline-block;"></span>`).join('');

          </div>
          <div style="display:flex;gap:6px;align-items:center;margin-bottom:14px;">${dots}<span style="font-size:11px;color:var(--t3);margin-left:6px;">${t('parent.week_xp', a.weekXP)}</span></div>
          ${a.total ? `
          <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:4px;">
            <span>🎯 ${t('parent.mastered', a.mastered)}</span><span>${a.mastered}/${a.total} · ${pct}%</span>
